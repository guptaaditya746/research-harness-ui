<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Pipeline</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1d2433; --muted: #5f6b7a; --line: #9aa5b4;
    --lane-a: #f4f6f9; --lane-b: #eef2f7;
    --node: #ffffff; --node-line: #b8c2cf;
    --llm: #4b3fb5;                          /* LLM badge */
    --people: #2f7d4f;                       /* people badge */
    --now: #d97706; --now-soft: #fff3dc;     /* "currently working here" */
    --paper: #1f5fa8; --paper-soft: #e5eefa; /* idea taken from a paper */
    --tool: #56606e; --tool-soft: #edf0f3;   /* tool, dataset or protocol used as is */
    --ours: #0d7a5f; --ours-soft: #e1f3ec;   /* our own contribution */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  main { padding: 28px 28px 40px; max-width: 1720px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin-bottom: 18px; }
  h1 { font: 600 34px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
  h2 { font: 600 24px/1.2 Georgia, "Times New Roman", serif; margin: 34px 0 14px; }
  .sub { margin: 0; font-size: 18px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 16px; align-items: center; max-width: 900px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend svg { width: 28px; height: 28px; }
  .key-now { width: 26px; height: 18px; border: 3px solid var(--now); background: var(--now-soft); border-radius: 5px; display: inline-block; }
  .key-chip { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1.5px solid; }
  .k-paper { color: var(--paper); background: var(--paper-soft); border-color: var(--paper); }
  .k-tool { color: var(--tool); background: var(--tool-soft); border-color: var(--tool); }
  .k-ours { color: var(--ours); background: var(--ours-soft); border-color: var(--ours); }
  #diagram { width: 100%; overflow-x: auto; }
  #diagram svg { display: block; width: 100%; min-width: 1100px; height: auto; }
  /* SVG styling */
  .lane-bg { fill: var(--lane-a); }
  .lane-bg.alt { fill: var(--lane-b); }
  .lane-bg.focus { fill: #fff8ec; }
  .lane-name { font: 700 19px/1 "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
  .lane-sub { font-size: 14.5px; fill: var(--muted); }
  .node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.6; }
  .node.now { fill: var(--now-soft); stroke: var(--now); stroke-width: 4; }
  .name { font-weight: 700; fill: var(--ink); }
  .desc { font-size: 14px; fill: var(--muted); }
  .chip-paper { fill: var(--paper-soft); stroke: var(--paper); stroke-width: 1.2; }
  .chip-tool { fill: var(--tool-soft); stroke: var(--tool); stroke-width: 1.2; }
  .chip-ours { fill: var(--ours-soft); stroke: var(--ours); stroke-width: 1.2; }
  .chip-text { font-size: 12.5px; font-weight: 600; }
  .ct-paper { fill: var(--paper); } .ct-tool { fill: var(--tool); } .ct-ours { fill: var(--ours); }
  .flow { stroke: var(--line); stroke-width: 2; fill: none; }
  .cross { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
  .cross.now { stroke: var(--now); stroke-dasharray: none; stroke-width: 2.5; }
  .edge-label { font-size: 13px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .arrow { fill: var(--line); }
  .arrow-now { fill: var(--now); }
  .flag { fill: var(--now); }
  .flag-text { font: 700 14px/1 "Segoe UI", system-ui, sans-serif; fill: #ffffff; letter-spacing: .06em; }
  .pulse { fill: none; stroke: var(--now); stroke-width: 3; opacity: .55; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.12, 1.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .35; } }
  .hl { filter: drop-shadow(0 0 0.35rem rgba(31, 95, 168, .55)); }
  /* reference list */
  .refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 10px 28px; }
  .ref { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: 8px; }
  .ref:hover, .ref.hl-row { background: var(--lane-a); }
  .ref .key-chip { justify-self: start; }
  .ref .cite { font-size: 15px; }
  .ref .used { font-size: 13.5px; color: var(--muted); }
  footer { margin-top: 18px; font-size: 14px; color: var(--muted); }
  /* details panel */
  #diagram .stage, #diagram .chip { cursor: pointer; }
  #diagram .stage:hover .node, #diagram .stage:focus-visible .node { stroke: var(--paper); stroke-width: 2.6; }
  #diagram .stage:focus, #diagram .chip:focus { outline: none; }
  #diagram .chip:hover rect, #diagram .chip:focus-visible rect { stroke-width: 2.4; }
  #diagram .stage.selected .node { stroke: var(--paper); stroke-width: 4; }
  .ref { cursor: pointer; }
  .hint { font-size: 15px; color: var(--muted); margin: 10px 0 0; }
  .scrim { position: fixed; inset: 0; background: rgba(29, 36, 51, .28); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 10; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: #fff; z-index: 11;
    box-shadow: -12px 0 32px rgba(29, 36, 51, .18); transform: translateX(102%); transition: transform .22s ease;
    display: flex; flex-direction: column; }
  .panel.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { .panel, .scrim { transition: none; } }
  .panel-top { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid #e3e7ed; }
  .panel-top button { font: inherit; font-size: 14px; border: 1px solid var(--node-line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .panel-top button:hover { background: var(--lane-a); }
  .panel-top button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .panel-top .spacer { flex: 1; }
  .panel-body { overflow-y: auto; padding: 20px 24px 32px; }
  .panel-kind { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .badge { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; }
  .b-llm { background: var(--llm); } .b-people { background: var(--people); } .b-now { background: var(--now); }
  .panel h3 { font: 600 28px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 4px; }
  .panel .lead { margin: 0 0 6px; color: var(--muted); font-size: 16px; }
  .panel section { margin-top: 20px; }
  .panel section h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .panel p, .panel li { font-size: 16px; line-height: 1.5; }
  .panel p { margin: 0; }
  .panel ul { margin: 0; padding-left: 20px; }
  .panel li + li { margin-top: 6px; }
  .panel code { font: 13.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--lane-a); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .io { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
  .io div { background: var(--lane-a); border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 1.4; }
  .io span { color: var(--muted); font-size: 20px; }
  .example { border-left: 4px solid var(--paper); background: var(--paper-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; }
  .ours-box { border-left: 4px solid var(--ours); background: var(--ours-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; }
  .ours-box.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 4px rgba(13, 122, 95, .45); } 100% { box-shadow: 0 0 0 0 rgba(13, 122, 95, 0); } }
  .differs { border-left: 4px solid var(--now); background: var(--now-soft); padding: 10px 14px 10px 32px; border-radius: 0 8px 8px 0; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links button { font: inherit; font-size: 13.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1.5px solid; cursor: pointer; }
  .links button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .links .l-stage { color: var(--ink); background: #fff; border-color: var(--node-line); }
  .cite-text { font-size: 15px; color: var(--ink); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="legend" id="legend"></div>
  </header>
  <div id="diagram" aria-label="Thesis pipeline diagram with the source of each idea"></div>
  <p class="hint">Click any box, chip or reference for what it is, how it works here, and where it comes from.</p>
  <h2>Where the ideas come from</h2>
  <div class="refs" id="refs"></div>
  <footer id="footer"></footer>
</main>

<script>
/* ===================================================================================
   EDIT HERE. Everything the page shows comes from these blocks.
   - SOURCES: every paper, tool or dataset the thesis builds on.
       short: the chip text   kind: "paper" | "tool"   cite: full reference   url: optional
   - LANES: one row each, top to bottom. `sources` on a lane = chips under the lane name.
   - STAGES: boxes. `lane` = row, `col` = position in the row (0 = leftmost).
       llm: true      -> LLM badge (the stage calls a language model)
       people: true   -> people badge (human work)
       current: true  -> highlighted as "currently working here"
       sources: [...] -> keys of SOURCES whose idea this stage uses (chips under the box)
       ours: "text"   -> an "ours" chip: what in this stage is our own contribution (oursTitle: its longer tooltip)
     Stages of one lane are joined left to right automatically (sorted by col).
   - LINKS: extra arrows between lanes: [from id, to id, label].
   - LLM_ICON_SRC: a data:image/... URI of the Qwen logo, to replace the generic LLM icon.
   - STAGE_DETAILS / SOURCE_DETAILS (below FOOTER): the text of the panel that opens on a click.
   Sources marked "TODO" are the ones to double-check against your bibliography.
   =================================================================================== */

const TITLE = "Thesis pipeline";
const SUBTITLE = "Research questions over a fixed corpus of papers, answered as a knowledge graph and checked against a gold standard";

const LLM_LABEL = "LLM call (Qwen)";
const LLM_ICON_SRC = null;   // e.g. "data:image/png;base64,...."  (null = generic LLM icon)

const SOURCES = {
  grobid:   { short: "GROBID",          kind: "tool",  cite: "GROBID: PDF to structured text (Lopez, ECDL 2009)" },
  bm25:     { short: "BM25",            kind: "paper", cite: "Robertson & Zaragoza. The Probabilistic Relevance Framework: BM25 and Beyond. FnTIR 2009" },
  rrf:      { short: "RRF",             kind: "paper", cite: "Cormack, Clarke & Büttcher. Reciprocal Rank Fusion. SIGIR 2009 (hybrid BM25 + dense ranking)" },
  dblp:     { short: "DBLP",            kind: "tool",  cite: "DBLP knowledge graph and RDF schema (papers, authors, venues, citations)" },
  cskg:     { short: "CS-KG 2.0",       kind: "tool",  cite: "CS-KG 2.0 ontology of computer-science entities and relations (KMi, The Open University)" },
  ambigqa:  { short: "AmbigQA",         kind: "paper", cite: "Min et al. AmbigQA: Answering Ambiguous Open-domain Questions. EMNLP 2020 (decide whether a question is ambiguous; answers are a set of (interpretation, answer) pairs scored by F1 against all interpretations). Here AmbigQA-style: one grounded reading per interpretation, scored as a set" },
  edc:      { short: "EDC",             kind: "paper", cite: "Zhang & Soh. Extract, Define, Canonicalize: An LLM-based Framework for Knowledge Graph Construction. EMNLP 2024" },
  mcp:      { short: "MCP",             kind: "tool",  cite: "Model Context Protocol (Anthropic, 2024): how the agent calls corpus tools" },
  sweagent: { short: "mini-SWE-agent",  kind: "paper", cite: "Yang et al. SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering. NeurIPS 2024 (mini-SWE-agent is its minimal version)" },
  zobel:    { short: "Zobel 1998",      kind: "paper", cite: "Zobel. How Reliable are the Results of Large-Scale Information Retrieval Experiments? SIGIR 1998 (pooled gold is biased)" },
  argilla:  { short: "Argilla",         kind: "tool",  cite: "Argilla: open-source annotation tool" },
  kappa:    { short: "Cohen's κ",       kind: "paper", cite: "Cohen. A Coefficient of Agreement for Nominal Scales. 1960 (agreement between reviewers)" },
  benchie:  { short: "BenchIE",         kind: "paper", cite: "Gashteovski et al. BenchIE: Fact-Based Open Information Extraction Evaluation. ACL 2022 (accepted variants of a fact)" },
  webnlg:   { short: "WebNLG 2020",     kind: "paper", cite: "WebNLG+ Challenge 2020 text-to-RDF evaluation (matching levels)" },
  text2kg:  { short: "Text2KGBench",    kind: "paper", cite: "Mihindukulasooriya et al. Text2KGBench: Ontology-Driven Knowledge Graph Generation from Text. ISWC 2023" },
  euzenat:  { short: "Euzenat 2007",    kind: "paper", cite: "Euzenat. Semantic Precision and Recall for Ontology Alignment Evaluation. IJCAI 2007 (entailed matching)" },
  judge:    { short: "LLM judge",       kind: "paper", cite: "Zheng et al. Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena. NeurIPS 2023; Mo et al. KGGen (MINE), 2025" },
  trec:     { short: "TREC RAG 2024",   kind: "paper", cite: "Pradeep et al. Nugget Evaluation for the TREC 2024 RAG Track. 2024 (vital nuggets → vital recall)" },
  adaptive: { short: "Adaptive-RAG",    kind: "paper", cite: "Jeong et al. Adaptive-RAG: Adapting Retrieval-Augmented LLMs through Question Complexity. NAACL 2024" },
  bootstrap:{ short: "Bootstrap",       kind: "paper", cite: "Efron & Tibshirani. An Introduction to the Bootstrap. 1993 (95% intervals over questions)" },
};

const LANES = [
  { id: "corpus",  name: "Corpus",           sub: "built once" },
  { id: "harness", name: "Research harness", sub: "per question, 4 paths",
    sources: [{ ours: "Fast, Adaptive, Agentic" }, { key: "sweagent", label: "External: mini-SWE-agent" }] },
  { id: "eval",    name: "Evaluation",       sub: "per run" },
  { id: "gold",    name: "Gold standard",    sub: "per question" },
];

const STAGES = [
  // Corpus
  { id: "papers",  lane: "corpus",  col: 0, name: "Papers",          desc: "337 PDFs",              llm: false },
  { id: "parse",   lane: "corpus",  col: 1, name: "Parse",           desc: "PDF to passages",       llm: false, sources: ["grobid"] },
  { id: "index",   lane: "corpus",  col: 2, name: "Index",           desc: "BM25 + dense",          llm: false, sources: ["bm25", "rrf"] },
  { id: "onto",    lane: "corpus",  col: 3, name: "Ontology",        desc: "DBLP + CS-KG",          llm: false, sources: ["dblp", "cskg"] },
  // Research harness (one run)
  { id: "question",lane: "harness", col: 0, name: "Question",        desc: "+ readings",            llm: true,  sources: ["ambigqa"], ours: "grounded readings", oursTitle: "AmbigQA-style: one grounded reading per interpretation, scored as a set" },
  { id: "retrieve",lane: "harness", col: 1, name: "Retrieve",        desc: "search the corpus",     llm: false, sources: ["mcp"], ours: "agent research" },
  { id: "schema",  lane: "harness", col: 2, name: "Schema",          desc: "terms for the answer",  llm: true,  ours: "per-question schema" },
  { id: "edc",     lane: "harness", col: 3, name: "EDC",             desc: "extract · define · map",llm: true,  sources: ["edc"] },
  { id: "review",  lane: "harness", col: 4, name: "Evidence review", desc: "keep or drop",          llm: true,  ours: "review" },
  { id: "answer",  lane: "harness", col: 5, name: "Answer",          desc: "compose + verify",      llm: true,  ours: "cited answer" },
  { id: "graph",   lane: "harness", col: 6, name: "Answer graph",    desc: "triples + passages",    llm: false, ours: "answer graph" },
  // Evaluation
  { id: "runs",    lane: "eval",    col: 3, name: "Runs",            desc: "A: corpus · B: D",      llm: false, ours: "mode B" },
  { id: "match",   lane: "eval",    col: 4, name: "Matching",        desc: "strict · entailed · soft", llm: true, sources: ["webnlg", "text2kg", "euzenat", "judge"] },
  { id: "scores",  lane: "eval",    col: 5, name: "Scores",          desc: "precision · recall",    llm: false, sources: ["trec", "bootstrap"] },
  { id: "results", lane: "eval",    col: 6, name: "Results",         desc: "complexity × path",     llm: false, sources: ["adaptive"] },
  // Gold standard
  { id: "screen",  lane: "gold",    col: 0, name: "Screen papers",   desc: "every paper",           llm: true,  ours: "coverage rows" },
  { id: "extract", lane: "gold",    col: 1, name: "Extract",         desc: "question scope",        llm: true,  sources: ["edc"] },
  { id: "D",       lane: "gold",    col: 2, name: "Document D",      desc: "triples + passages",    llm: false, current: true, sources: ["zobel"], ours: "D: supervisor's idea" },
  { id: "triage",  lane: "gold",    col: 3, name: "Triage",          desc: "answers / context",     llm: true,  ours: "triage + sample" },
  { id: "human",   lane: "gold",    col: 4, name: "Human review",    desc: "two reviewers",         llm: false, people: true, sources: ["argilla", "kappa"] },
  { id: "key",     lane: "gold",    col: 5, name: "Answer key",      desc: "gold triples",          llm: false, sources: ["benchie", "ambigqa"] },
];

const LINKS = [
  ["index", "retrieve", "search"],
  ["onto",  "schema",   "terms"],
  ["graph", "runs",     "run triples"],
  ["D",     "runs",     "input of mode B"],
  ["key",   "match",    "gold"],
];

const FOOTER = "Blue chips: an idea taken from a paper. Grey chips: a tool, dataset or protocol used as is. Green chips: our own contribution. Click a box, chip or reference for details (Esc closes); a link ending in #stage=edc or #source=edc opens that panel directly.";

/* ---- STAGE_DETAILS / SOURCE_DETAILS: what the panel shows when a box, chip or lane is clicked -------------------------
   STAGE_DETAILS: one entry per STAGES id (plus "paths" for the lane chip). SOURCE_DETAILS: one per SOURCES key. Every field is optional:
     what      one or two sentences: what this is
     how       bullet list: how it works in our system
     io        [input, output]
     example   a short worked example
     ours      what in this step is our own contribution
     differs   (sources) where we deviate from the paper; (stages) known limits
     settings  settings that change it (name: what it does)
     code      files where it lives
   ---------------------------------------------------------------------------------------------- */
const STAGE_DETAILS = {
  // ---------------------------------------------------------------- Corpus
  papers: {
    what: "The fixed set of research papers every question is answered from. The corpus never changes during an experiment, so every path and every repetition sees exactly the same papers.",
    how: [
      "337 papers, all verified against DBLP: 37 original papers, 150 ACL 2025 long papers and 150 EMNLP 2025 main papers.",
      "Each paper also brings its DBLP facts (title, authors, venue, year) and its reference list (about 18,000 references).",
      "Corpus-wide questions (\"which benchmarks do the RAG papers use?\") need many papers at once; that is the hard case the thesis is about.",
    ],
    io: ["PDF files + DBLP records", "the paper set the rest of the pipeline reads"],
    code: ["corpus_data/ (papers.jsonl, passages.jsonl, facts.jsonl, references.jsonl)", "packages/corpus/src/harness_corpus/ingest.py"],
  },
  parse: {
    what: "Turns each PDF into clean, addressable text: passages with their section, plus the reference list.",
    how: [
      "GROBID converts the PDF to TEI XML: title, sections, paragraphs, references.",
      "Every paragraph becomes a passage with a stable id (e.g. p97-12) and its section path, so every later fact can cite the exact passage it came from.",
      "References are resolved against the corpus where possible, giving citation links between papers.",
    ],
    io: ["PDF", "passages (id, paper, section, text) + references"],
    ours: "Stable passage ids are the backbone of provenance: every triple, answer sentence and gold fact points to one.",
    code: ["packages/corpus/src/harness_corpus/ingest.py", "make ingest / make ingest-slurm"],
  },
  index: {
    what: "Search indexes over all passages, so a question can find the passages that talk about it.",
    how: [
      "BM25 (bm25s, Lucene variant, k1 = 1.5, b = 0.75, lowercase words, English stopwords, no stemming).",
      "Optional dense index: passage embeddings from Qwen3-Embedding, L2-normalised; queries get the model's instruction prefix.",
      "Hybrid ranking fuses the BM25 list and the dense list with Reciprocal Rank Fusion (k = 60, lists 1000 deep).",
      "Lexical and hybrid mode use the same candidates and the same top-k cut-off; the mode only decides whether the dense list joins the fusion, so the two can be compared cleanly.",
      "An optional reranker reorders the top 30 in either mode.",
    ],
    io: ["passages", "ranked passages for any query"],
    settings: ["HARNESS_RETRIEVAL_MODE: lexical (BM25) or hybrid (BM25 + dense)", "HARNESS_MODEL_EMBEDDING: the embedding model (make embed builds the dense index)", "HARNESS_MODEL_RERANK: a served reranker, empty = none"],
    code: ["packages/corpus/src/harness_corpus/store.py (hybrid_rank)", "packages/corpus/src/harness_corpus/dense.py (rrf)"],
  },
  onto: {
    what: "The vocabulary facts are written in: which kinds of things exist (classes) and which relations may link them (properties).",
    how: [
      "DBLP schema for bibliographic facts: authoredBy, publishedIn, yearOfPublication, cites, …",
      "A subset of CS-KG 2.0 for research content: uses / usedBy, evaluatesOn, … (hrn:uses is declared equivalent to cskg:uses).",
      "Our own hrn: terms for what neither covers (e.g. addressesProblem, evaluatesAttack).",
      "Written in OWL 2 (domains, ranges, sub-properties, inverses). The scorer closes it with an OWL 2 RL reasoner (owlrl) so it knows, e.g., that \"X uses Y\" states the same fact as \"Y usedBy X\".",
    ],
    io: ["DBLP schema + CS-KG subset + harness terms", "one ontology used by extraction, the answer graph and scoring"],
    code: ["packages/semantic (hand_written_subschema)", "seed/cskg_ontology_2.0_subset.ttl", "datasets/ontology/predicate_relations.ttl (extra rules)"],
  },

  // ---------------------------------------------------------------- Research harness
  question: {
    what: "Understanding the question before any search: what kind of question is it, which papers does it name, and (Agentic) which readings could it have.",
    how: [
      "Fast and Adaptive: a query planner (one LLM call) turns the question into a typed plan: an operation such as paper_authors, citing_papers or author_paper_counts that is answered from verified DBLP facts, or \"research\" (full-text research); plus the papers it names, resolved to corpus ids. `make eval-planner` checks it on 32 phrasings.",
      "Agentic: concept readings. The model first decides whether the question is ambiguous: one reading if not, up to 4 if it is (\"best author\" = most papers? most cited?). Each reading has a label, a gloss, classes and search terms, and is checked against the corpus: readings with no supporting passage are hidden.",
      "In the UI the person picks a reading. In evaluation runs every grounded reading is researched (one run each) and the runs are scored together as one answer.",

const LABEL_W = 250, COL_W = 200, NODE_W = 178, NODE_H = 86, CHIP_H = 22, CHIP_GAP = 5, TOP = 14, FLAG_H = 46;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};

// chips of a stage: its sources, then its "ours" note
function chipsOf(s) {
  const out = (s.sources || []).map(key => {
    const src = SOURCES[key];
    if (!src) { console.warn("unknown source", key); return null; }
    return { kind: src.kind, text: src.short, title: src.cite, key };
  }).filter(Boolean);
  if (s.ours) out.push({ kind: "ours", text: s.ours, title: `Our contribution: ${s.oursTitle || s.ours}`, ours: s.id });
  return out;
}
const stackHeight = n => n ? 8 + n * CHIP_H + (n - 1) * CHIP_GAP : 0;

function llmIcon(parent, cx, cy, r) {
  el("circle", { cx, cy, r, fill: "var(--llm)" }, parent);
  if (LLM_ICON_SRC) {
    const s = r * 1.5;
    el("image", { href: LLM_ICON_SRC, x: cx - s / 2, y: cy - s / 2, width: s, height: s }, parent);
    return;
  }
  const star = (x, y, a, b) => `M${x} ${y - a} Q${x + b} ${y - b} ${x + a} ${y} Q${x + b} ${y + b} ${x} ${y + a} Q${x - b} ${y + b} ${x - a} ${y} Q${x - b} ${y - b} ${x} ${y - a} Z`;
  el("path", { d: star(cx - r * 0.12, cy + r * 0.08, r * 0.62, r * 0.14), fill: "#fff" }, parent);
  el("path", { d: star(cx + r * 0.45, cy - r * 0.45, r * 0.28, r * 0.07), fill: "#fff" }, parent);
}

function peopleIcon(parent, cx, cy, r) {
  el("circle", { cx, cy, r, fill: "var(--people)" }, parent);
  el("circle", { cx, cy: cy - r * 0.28, r: r * 0.26, fill: "#fff" }, parent);
  el("path", { d: `M${cx - r * 0.52} ${cy + r * 0.55} Q${cx - r * 0.5} ${cy + r * 0.02} ${cx} ${cy + r * 0.02} Q${cx + r * 0.5} ${cy + r * 0.02} ${cx + r * 0.52} ${cy + r * 0.55} Z`, fill: "#fff" }, parent);
}

function fitText(text, maxWidth, size, min = 10) {
  text.setAttribute("font-size", size);
  while (text.getComputedTextLength() > maxWidth && size > min) {
    size -= 0.5;
    text.setAttribute("font-size", size);
  }
}

function chip(parent, x, y, w, c) {
  const g = el("g", { class: "chip", "data-key": c.key || "", "data-ours": c.ours || "", tabindex: 0, role: "button",
                      "aria-label": `${c.text}: details` }, parent);
  el("rect", { x, y, width: w, height: CHIP_H, rx: CHIP_H / 2, class: `chip-${c.kind}` }, g);
  const t = el("text", { x: x + w / 2, y: y + 15.5, "text-anchor": "middle", class: `chip-text ct-${c.kind}` }, g);
  t.textContent = c.text;
  fitText(t, w - 12, 12.5, 9);
  el("title", {}, g).textContent = `${c.title} (click for details)`;
  return g;
}

function draw() {
  const host = document.getElementById("diagram");
  host.textContent = "";
  const cols = Math.max(...STAGES.map(s => s.col)) + 1;
  const W = LABEL_W + cols * COL_W + 10;
  // each lane is as tall as its tallest box + chip stack (+ the flag under the current stage)
  const laneH = LANES.map(lane => {
    const tallest = Math.max(0, ...STAGES.filter(s => s.lane === lane.id)
      .map(s => stackHeight(chipsOf(s).length) + (s.current ? FLAG_H : 0)));
    const labelChips = 70 + (lane.sources || []).length * (CHIP_H + CHIP_GAP);
    return Math.max(NODE_H + tallest + 44, labelChips + 20, 150);
  });
  const laneTop = laneH.map((_, i) => TOP + laneH.slice(0, i).reduce((a, b) => a + b, 0));
  const H = TOP + laneH.reduce((a, b) => a + b, 0) + 10;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` }, host);
  const defs = el("defs", {}, svg);
  for (const [id, cls] of [["arr", "arrow"], ["arr-now", "arrow-now"]]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0 0 L10 5 L0 10 z", class: cls }, m);
  }

  const laneIndex = Object.fromEntries(LANES.map((l, i) => [l.id, i]));
  const pos = {};
  for (const s of STAGES) {
    const li = laneIndex[s.lane];
    const chips = chipsOf(s);
    pos[s.id] = { x: LABEL_W + s.col * COL_W + (COL_W - NODE_W) / 2, y: laneTop[li] + 26, s, chips,
                  bottom: laneTop[li] + 26 + NODE_H + stackHeight(chips.length) };
  }

  // lanes
  LANES.forEach((lane, i) => {
    const y = laneTop[i];
    const focus = STAGES.some(s => s.lane === lane.id && s.current);
    el("rect", { x: 0, y: y + 4, width: W, height: laneH[i] - 8, rx: 12, class: `lane-bg${i % 2 ? " alt" : ""}${focus ? " focus" : ""}` }, svg);
    el("text", { x: 22, y: y + 58, class: "lane-name" }, svg).textContent = lane.name;
    el("text", { x: 22, y: y + 82, class: "lane-sub" }, svg).textContent = lane.sub || "";
    (lane.sources || []).forEach((src, k) => {
      const c = src.ours
        ? { kind: "ours", text: src.ours, title: `Our contribution: ${src.ours}`, ours: "paths" }
        : { kind: SOURCES[src.key].kind, text: src.label || SOURCES[src.key].short, title: SOURCES[src.key].cite, key: src.key };
      chip(svg, 22, y + 96 + k * (CHIP_H + CHIP_GAP), LABEL_W - 40, c);
    });
  });

  const edgeLayer = el("g", {}, svg);
  const nodeLayer = el("g", {}, svg);

  // flow arrows inside each lane
  for (const lane of LANES) {
    const row = STAGES.filter(s => s.lane === lane.id).sort((a, b) => a.col - b.col);
    for (let i = 0; i + 1 < row.length; i++) {
      const a = pos[row[i].id], b = pos[row[i + 1].id];
      el("line", { x1: a.x + NODE_W, y1: a.y + NODE_H / 2, x2: b.x - 3, y2: b.y + NODE_H / 2, class: "flow", "marker-end": "url(#arr)" }, edgeLayer);
    }
  }

  // links between lanes (they leave below a box's chips and arrive at the top of a box, or the reverse)
  for (const [from, to, label] of LINKS) {
    const a = pos[from], b = pos[to];
    if (!a || !b) { console.warn("LINKS: unknown stage", from, to); continue; }
    const down = b.y > a.y;
    const shift = a.s.col === b.s.col ? 0 : (b.s.col > a.s.col ? 22 : -22);
    const sx = a.x + NODE_W / 2 + shift, tx = b.x + NODE_W / 2 - shift;
    const flagOffset = s => (s.current ? FLAG_H : 0);
    const sy = down ? a.bottom + 4 + flagOffset(a.s) : a.y;
    const ty = down ? b.y - 3 : b.bottom + 6;
    const my = (sy + ty) / 2;
    const now = a.s.current || b.s.current;
    let d = `M${sx} ${sy} C${sx} ${my} ${tx} ${my} ${tx} ${ty}`;
    if (!down && a.s.current) {        // from the current stage upwards: leave from its side, clear of the flag
      const sideX = a.x + NODE_W, sideY = a.y + NODE_H / 2 - 18;
      d = `M${sideX} ${sideY} C${sideX + 60} ${sideY} ${tx} ${ty + 40} ${tx} ${ty}`;
    }
    el("path", { d, class: `cross${now ? " now" : ""}`, "marker-end": `url(#${now ? "arr-now" : "arr"})` }, edgeLayer);
    if (label) {
      const t = el("text", { x: (sx + tx) / 2 + 10, y: my + 4, class: "edge-label" }, edgeLayer);
      t.textContent = label;
    }
  }

  // stages
  for (const s of STAGES) {
    const { x, y, chips } = pos[s.id];
    const g = el("g", { class: "stage", "data-stage": s.id, tabindex: 0, role: "button", "aria-label": `${s.name}: details` }, nodeLayer);
    if (s.current) el("rect", { x, y, width: NODE_W, height: NODE_H, rx: 12, class: "pulse" }, g);
    el("rect", { x, y, width: NODE_W, height: NODE_H, rx: 12, class: `node${s.current ? " now" : ""}` }, g);
    const name = el("text", { x: x + NODE_W / 2, y: y + 38, "text-anchor": "middle", class: "name" }, g);
    name.textContent = s.name;
    const desc = el("text", { x: x + NODE_W / 2, y: y + 62, "text-anchor": "middle", class: "desc" }, g);
    desc.textContent = s.desc || "";
    fitText(name, NODE_W - 26, 18, 11);
    fitText(desc, NODE_W - 16, 14, 11);
    if (s.llm) llmIcon(g, x + NODE_W - 6, y + 6, 15);
    if (s.people) peopleIcon(g, x + NODE_W - 6, y + 6, 15);
    el("title", {}, g).textContent = `${s.name}: ${s.desc || ""}${s.llm ? " · LLM calls" : ""}${s.people ? " · people" : ""} (click for details)`;
    chips.forEach((c, k) => chip(nodeLayer, x + 6, y + NODE_H + 8 + k * (CHIP_H + CHIP_GAP), NODE_W - 12, c));
    if (s.current) {
      const fx = x + NODE_W / 2, fy = pos[s.id].bottom + 16;
      el("path", { d: `M${fx - 8} ${fy} L${fx} ${fy - 11} L${fx + 8} ${fy} Z`, class: "flag" }, g);
      const pill = el("rect", { y: fy, height: 30, rx: 15, class: "flag" }, g);
      const label = el("text", { x: fx, y: fy + 20, "text-anchor": "middle", class: "flag-text" }, g);
      label.textContent = "CURRENTLY WORKING HERE";
      const w = label.getComputedTextLength() + 34;
      pill.setAttribute("x", fx - w / 2);
      pill.setAttribute("width", w);
    }
  }
}

function references() {
  const box = document.getElementById("refs");
  const usedBy = {};
  for (const s of STAGES) for (const key of s.sources || []) (usedBy[key] ||= []).push(s.name);
  for (const lane of LANES) for (const src of lane.sources || []) if (src.key) (usedBy[src.key] ||= []).push(lane.name);
  const order = Object.keys(SOURCES).sort((a, b) => (SOURCES[a].kind === "paper" ? 0 : 1) - (SOURCES[b].kind === "paper" ? 0 : 1));
  for (const key of order) {
    const src = SOURCES[key];
    const row = document.createElement("div");
    row.className = "ref";
    row.dataset.key = key;
    row.innerHTML = `<span class="key-chip k-${src.kind}"></span><div><div class="cite"></div><div class="used"></div></div>`;
    row.querySelector(".key-chip").textContent = src.short;
    row.querySelector(".cite").textContent = src.cite;
    row.querySelector(".used").textContent = usedBy[key] ? `Used in: ${usedBy[key].join(", ")}` : "Not placed on a stage yet";
    box.appendChild(row);
  }
  // hovering a chip in the diagram marks its reference row, and the reverse
  const rows = [...box.querySelectorAll(".ref")];
  const chipsFor = key => [...document.querySelectorAll(`#diagram .chip[data-key="${key}"]`)];
  document.querySelectorAll("#diagram .chip").forEach(c => {
    const key = c.dataset.key;
    if (!key) return;
    c.addEventListener("mouseenter", () => rows.forEach(r => r.classList.toggle("hl-row", r.dataset.key === key)));
    c.addEventListener("mouseleave", () => rows.forEach(r => r.classList.remove("hl-row")));
  });
  rows.forEach(r => {
    r.addEventListener("mouseenter", () => chipsFor(r.dataset.key).forEach(c => c.classList.add("hl")));
    r.addEventListener("mouseleave", () => chipsFor(r.dataset.key).forEach(c => c.classList.remove("hl")));
  });
}

/* ============================== details panel (no edits needed) ============================== */
const LANE_NAME = Object.fromEntries(LANES.map(l => [l.id, l.name]));
const KIND_LABEL = { paper: "Idea from a paper", tool: "Tool or data", ours: "Our contribution" };
const STAGE_BY_ID = Object.fromEntries(STAGES.map(s => [s.id, s]));
const panelHistory = [];
let lastFocus = null;

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c);
  return node;
}
// `code like this` inside the text becomes <code>
function rich(text) {
  return String(text).split(/(`[^`]+`)/).map(part => part.startsWith("`") && part.endsWith("`") ? h("code", {}, part.slice(1, -1)) : part);
}
const section = (title, ...body) => h("section", {}, h("h4", {}, title), ...body);
const list = (items, cls) => h("ul", cls ? { class: cls } : {}, (items || []).map(i => h("li", {}, rich(i))));
const sourceButton = key => h("button", { class: `k-${SOURCES[key].kind}`, type: "button", onclick: () => openDetails("source", key) }, SOURCES[key].short);
const stageButton = id => h("button", { class: "l-stage", type: "button", onclick: () => openDetails("stage", id) }, STAGE_BY_ID[id] ? STAGE_BY_ID[id].name : id);

function stageNeighbours(id) {
  const s = STAGE_BY_ID[id];
  if (!s) return { before: [], after: [] };
  const row = STAGES.filter(x => x.lane === s.lane).sort((a, b) => a.col - b.col);
  const i = row.indexOf(s);
  const before = [...(i > 0 ? [row[i - 1].id] : []), ...LINKS.filter(l => l[1] === id).map(l => l[0])];
  const after = [...(i + 1 < row.length ? [row[i + 1].id] : []), ...LINKS.filter(l => l[0] === id).map(l => l[1])];
  return { before, after };
}

function renderStage(id) {
  const s = STAGE_BY_ID[id];
  const d = STAGE_DETAILS[id] || {};
  const body = [];
  const kind = h("div", { class: "panel-kind" },
    h("b", { class: "key-chip k-tool" }, s ? `${LANE_NAME[s.lane]} · step ${STAGES.filter(x => x.lane === s.lane && x.col <= s.col).length}` : "Research harness"),
    s && s.llm ? h("span", { class: "badge b-llm" }, "LLM calls") : null,
    s && s.people ? h("span", { class: "badge b-people" }, "People") : null,
    s && s.current ? h("span", { class: "badge b-now" }, "Currently working here") : null);
  body.push(kind, h("h3", {}, d.title || (s ? s.name : id)));
  if (s && s.desc) body.push(h("p", { class: "lead" }, s.desc));
  if (d.what) body.push(section("What it is", h("p", {}, rich(d.what))));
  if (d.how) body.push(section("How it works here", list(d.how)));
  if (d.io) body.push(section("Input → output", h("div", { class: "io" }, h("div", {}, rich(d.io[0])), h("span", { "aria-hidden": "true" }, "→"), h("div", {}, rich(d.io[1])))));
  if (d.example) body.push(section("Example", h("p", { class: "example" }, rich(d.example))));
  const ours = d.ours || (s && (s.oursTitle || s.ours));
  if (ours) body.push(section("Our contribution", h("p", { class: "ours-box", id: "panel-ours" }, rich(ours))));
  if (d.differs) body.push(section("Known limits", list(d.differs, "differs")));
  if (s && s.sources && s.sources.length) body.push(section("Ideas used (click for details)", h("div", { class: "links" }, s.sources.map(sourceButton))));
  const { before, after } = stageNeighbours(id);
  if (before.length || after.length) body.push(section("Connected steps",
    h("div", { class: "links" }, ...before.map(x => h("span", {}, stageButton(x))), before.length ? h("span", { "aria-hidden": "true" }, "→ this step →") : null, ...after.map(stageButton))));
  if (d.settings) body.push(section("Settings", list(d.settings)));
  if (d.code) body.push(section("Where in the code", list(d.code.map(c => "`" + c + "`"))));
  return body;
}

function renderSource(key) {
  const src = SOURCES[key];
  const d = SOURCE_DETAILS[key] || {};
  const usedBy = STAGES.filter(s => (s.sources || []).includes(key)).map(s => s.id);
  const lanes = LANES.filter(l => (l.sources || []).some(x => x.key === key)).map(l => l.name);
  const body = [
    h("div", { class: "panel-kind" }, h("b", { class: `key-chip k-${src.kind}` }, KIND_LABEL[src.kind])),
    h("h3", {}, src.short),
  ];
  if (d.what) body.push(section(src.kind === "paper" ? "The idea" : "What it is", h("p", {}, rich(d.what))));
  if (d.how) body.push(section("How we use it", list(d.how)));
  if (d.differs) body.push(section("Where we differ", list(d.differs, "differs")));
  if (usedBy.length || lanes.length) body.push(section("Used in (click for details)",
    h("div", { class: "links" }, usedBy.map(stageButton), lanes.map(n => h("button", { class: "l-stage", type: "button", onclick: () => openDetails("stage", "paths") }, n)))));
  body.push(section("Reference", h("p", { class: "cite-text" }, src.cite), src.url ? h("p", {}, h("a", { href: src.url, target: "_blank", rel: "noopener" }, src.url)) : null));
  return body;
}

function openDetails(kind, key, { focusOurs = false, fromHistory = false } = {}) {
  const panel = document.getElementById("panel");
  if (!panel.classList.contains("open")) { lastFocus = document.activeElement; panelHistory.length = 0; }
  else if (!fromHistory && panel.dataset.current) panelHistory.push(panel.dataset.current);
  panel.dataset.current = `${kind}:${key}`;
  const body = panel.querySelector(".panel-body");
  body.replaceChildren(...(kind === "source" ? renderSource(key) : renderStage(key)));
  body.scrollTop = 0;
  panel.querySelector(".back").hidden = panelHistory.length === 0;
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("open");
  document.querySelectorAll("#diagram .stage").forEach(g => g.classList.toggle("selected", kind === "stage" && g.dataset.stage === key));
  history.replaceState(null, "", `#${kind}=${encodeURIComponent(key)}`);
  if (focusOurs) {
    const box = document.getElementById("panel-ours");
    if (box) { box.scrollIntoView({ block: "center" }); box.classList.add("flash"); }
  }
  panel.querySelector(".close").focus({ preventScroll: true });
}

function closeDetails() {
  const panel = document.getElementById("panel");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  panel.dataset.current = "";
  document.getElementById("scrim").classList.remove("open");
  document.querySelectorAll("#diagram .stage").forEach(g => g.classList.remove("selected"));
  history.replaceState(null, "", location.pathname + location.search);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function detailsTarget(node) {
  if (node.dataset.stage) return ["stage", node.dataset.stage, {}];
  if (node.dataset.key) return ["source", node.dataset.key, {}];
  if (node.dataset.ours) return ["stage", node.dataset.ours, { focusOurs: true }];
  return null;
}

function wireDetails() {
  const panel = h("aside", { id: "panel", class: "panel", role: "dialog", "aria-modal": "true", "aria-hidden": "true", "aria-label": "Details" },
    h("div", { class: "panel-top" },
      h("button", { class: "back", type: "button", onclick: () => { const prev = panelHistory.pop(); if (prev) { const [k, v] = prev.split(/:(.*)/s); openDetails(k, v, { fromHistory: true }); } } }, "← Back"),
      h("span", { class: "spacer" }),
      h("button", { class: "close", type: "button", onclick: closeDetails, "aria-label": "Close details" }, "Close ✕")),
    h("div", { class: "panel-body" }));
  document.body.append(h("div", { id: "scrim", class: "scrim", onclick: closeDetails }), panel);
  const diagram = document.getElementById("diagram");
  const activate = event => {
    const node = event.target.closest(".stage, .chip");
    if (!node) return;
    const target = detailsTarget(node);
    if (target) openDetails(target[0], target[1], target[2]);
  };
  diagram.addEventListener("click", activate);
  diagram.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); activate(event); }
  });
  document.querySelectorAll(".ref").forEach(row => {
    row.tabIndex = 0;
    row.setAttribute("role", "button");
    row.addEventListener("click", () => openDetails("source", row.dataset.key));
    row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetails("source", row.dataset.key); } });
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && panel.classList.contains("open")) closeDetails(); });
  // a link like thesis_pipeline.html#stage=edc opens that panel
  const fromHash = () => {
    const m = location.hash.match(/^#(stage|source)=(.+)$/);
    if (!m) return;
    const key = decodeURIComponent(m[2]);
    if (m[1] === "source" ? SOURCES[key] : (STAGE_BY_ID[key] || STAGE_DETAILS[key])) openDetails(m[1], key);
  };
  window.addEventListener("hashchange", fromHash);
  fromHash();
}

function legend() {
  const box = document.getElementById("legend");
  const item = (drawIcon, label) => {
    const span = document.createElement("span");
    const svg = el("svg", { viewBox: "0 0 30 30" }, span);
    drawIcon(svg);
    span.append(label);
    box.appendChild(span);
  };
  item(svg => llmIcon(svg, 15, 15, 13), LLM_LABEL);
  item(svg => peopleIcon(svg, 15, 15, 13), "People");
  const add = html => { const s = document.createElement("span"); s.innerHTML = html; box.appendChild(s); };
  add('<i class="key-now"></i>Currently working here');
  add('<b class="key-chip k-paper">EDC</b>Idea from a paper');
  add('<b class="key-chip k-tool">GROBID</b>Tool or data');
  add('<b class="key-chip k-ours">review</b>Our contribution');
}

document.getElementById("title").textContent = TITLE;
document.getElementById("subtitle").textContent = SUBTITLE;
document.getElementById("footer").textContent = FOOTER;
legend();
draw();
references();
wireDetails();
</script>
</body>
