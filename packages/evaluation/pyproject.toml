[project]
name = "harness-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harness-schema",
    "harness-config",
    "harness-prompts",
    "harness-semantic",
    "numpy>=1.26",
    "rdflib>=7,<8",
    "scipy>=1.15",
]

[project.scripts]
harness-eval = "harness_evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-config = { workspace = true }
harness-prompts = { workspace = true }
harness-schema = { workspace = true }
harness-semantic = { workspace = true }
