[project]
name = "harness-mcp-corpus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harness-config",
    "harness-corpus",
    "harness-prompts",
    "mcp>=1.0,<2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-config = { workspace = true }
harness-corpus = { workspace = true }
harness-prompts = { workspace = true }
