[project]
name = "harness-runs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harness-schema",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "harness-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-config = { workspace = true }
harness-schema = { workspace = true }
