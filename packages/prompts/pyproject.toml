[project]
name = "harness-prompts"
version = "0.1.0"
description = "Versioned Jinja prompt templates for every model call in the research harness."
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "harness-config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_prompts"]
