[project]
name = "harness-corpus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3,<0.4",
    "docling>=2,<3",
    "grobid-client-python>=0.0.11",
    "httpx>=0.27",
    "numpy>=1.26",
    "regex>=2024.1",
    "harness-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-config = { workspace = true }
