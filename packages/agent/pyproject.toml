[project]
name = "harness-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harness-baseline",
    "harness-config",
    "harness-observability",
    "harness-prompts",
    "harness-schema",
    "deepagents>=0.7.16,<1",
    "mcp>=1.0,<2.0",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-config = { workspace = true }
harness-prompts = { workspace = true }
harness-baseline = { workspace = true }
harness-schema = { workspace = true }
harness-observability = { workspace = true }
