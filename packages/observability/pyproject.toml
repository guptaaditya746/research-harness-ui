[project]
name = "harness-observability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=4,<5",
    "opentelemetry-api>=1.28",
    "structlog>=24.4",
    "harness-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
harness-config = { workspace = true }
