[project]
name = "harness-observability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langtrace-python-sdk>=3.0",
    "opentelemetry-api>=1.28",
    "structlog>=24.4",
    "importlib-metadata>=8.0",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
