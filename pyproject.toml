[project]
name = "research-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harness-schema",
    "harness-runs",
    "harness-observability",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "harness-corpus",
    "harness-mcp-corpus",
    "harness-ledger",
    "harness-semantic",
    "harness-graphstore",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "hypothesis>=6"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
harness-schema = { workspace = true }
harness-runs = { workspace = true }
harness-observability = { workspace = true }
harness-corpus = { workspace = true }
harness-mcp-corpus = { workspace = true }
harness-ledger = { workspace = true }
harness-semantic = { workspace = true }
harness-graphstore = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["packages/schema/tests", "packages/runs/tests", "packages/observability/tests", "packages/corpus/tests", "packages/ledger/tests", "packages/semantic/tests", "packages/graphstore/tests", "api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
