[project]
name = "research-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harness-schema",
    "harness-config",
    "harness-prompts",
    "harness-runs",
    "harness-observability",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "harness-corpus",
    "harness-mcp-corpus",
    "harness-ledger",
    "harness-semantic",
    "harness-graphstore",
    "harness-extraction",
    "harness-baseline",
    "harness-agent",
    "harness-evaluation",
    "sse-starlette>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6",
    "watchfiles>=0.21",
    "import-linter>=2.1",
    "harness-public-gateway",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
harness-schema = { workspace = true }
harness-config = { workspace = true }
harness-prompts = { workspace = true }
harness-runs = { workspace = true }
harness-observability = { workspace = true }
harness-corpus = { workspace = true }
harness-mcp-corpus = { workspace = true }
harness-ledger = { workspace = true }
harness-semantic = { workspace = true }
harness-graphstore = { workspace = true }
harness-extraction = { workspace = true }
harness-baseline = { workspace = true }
harness-agent = { workspace = true }
harness-evaluation = { workspace = true }
harness-public-gateway = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["packages/config/tests", "packages/prompts/tests", "packages/schema/tests", "packages/runs/tests", "packages/observability/tests", "packages/corpus/tests", "packages/ledger/tests", "packages/semantic/tests", "packages/graphstore/tests", "packages/extraction/tests", "packages/baseline/tests", "packages/agent/tests", "packages/evaluation/tests", "packages/public_gateway/tests", "api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.importlinter]
root_packages = [
    "harness_agent", "harness_baseline", "harness_config", "harness_corpus", "harness_evaluation",
    "harness_extraction", "harness_graphstore", "harness_ledger", "harness_mcp_corpus",
    "harness_observability", "harness_prompts", "harness_public_gateway", "harness_runs",
    "harness_schema", "harness_semantic",
]

# Higher layers may import lower ones, never the reverse. Packages joined by
# "|" are siblings and must not import each other. See AGENTS.md ("Layers").
[[tool.importlinter.contracts]]
name = "Research packages are layered"
type = "layers"
layers = [
    "harness_agent",
    "harness_baseline",
    "harness_extraction | harness_graphstore | harness_mcp_corpus | harness_evaluation | harness_runs",
    "harness_corpus | harness_semantic | harness_observability | harness_ledger | harness_prompts",
    "harness_schema | harness_config",
]

# The internet-facing gateway talks to the API over HTTP only.
[[tool.importlinter.contracts]]
name = "Public gateway imports no harness internals"
type = "forbidden"
source_modules = ["harness_public_gateway"]
forbidden_modules = [
    "harness_agent", "harness_baseline", "harness_corpus", "harness_evaluation",
    "harness_extraction", "harness_graphstore", "harness_ledger", "harness_mcp_corpus",
    "harness_observability", "harness_prompts", "harness_runs", "harness_semantic",
]
